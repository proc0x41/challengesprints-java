spring.application.name=alpha4-soul-up
server.port=${PORT:8080}
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./data/soulup;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.datasource.hikari.maximum-pool-size=10
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
app.admin-key=${ADMIN_KEY:}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://chellengesprints-alpha4.vercel.app}
app.seed-demo=${SEED_DEMO:true}
